id: github
name: "GitHub"
version: 1.0.12
description: Connect your agent to GitHub — manage repositories, issues, pull requests, and more (multi-account)
license: MIT
min_gateway_version: 1.0.0

# Connect providers this integration's tools resolve credentials from.
# OR-semantics: any one satisfies. Validated against the connect provider registry.
requires_connection: [github]

supported_agents: [openclaw, hermes]

author:
  name: Alfe
  url: https://alfe.ai

pricing:
  type: free

features:
  - Multi-account support — connect a personal account and an org bot side-by-side
  - Pattern A — every credential-touching tool requires an explicit `login` selector
  - Full GitHub API access via the @alfe.ai/github-mcp proxy
  - Repository management (create, list, search)
  - Issues and pull requests (create, comment, review)
  - Code search and file operations
  - Shell git and GitHub CLI (`gh`) access — connected accounts are logged into `gh`; shell `git` uses the active account (most specific scope, then most recently connected) — switch with `gh auth switch --hostname github.com --user <login>`

installs:
  runtimes:
    openclaw: {}
    # Hermes runs the same runtime-agnostic stdio MCP server declared in
    # the top-level `mcp_servers` block — no plugin/skill/config to apply.
    hermes: {}

# Shell access: post_install installs the GitHub CLI (best effort, Debian/
# Ubuntu as root); post_activate logs every connected account into `gh` and
# configures git's credential helper, recording what it owns under
# ~/.alfe/github-cli/; post_uninstall removes only those contributions.
# Hooks run once per integration, gated on supported_agents (openclaw, hermes).
hooks:
  post_install: hooks/post-install.sh
  post_activate: hooks/post_activate.mjs
  post_uninstall: hooks/post_uninstall.mjs
  health_check: hooks/health.sh

mcp_servers:
  - id: github
    command: npx
    # The proxy fetches credentials from the Alfe API at startup
    # (Pattern A multi-account) rather than reading them via env
    # interpolation. `requires_credentials` is kept for marketplace /
    # registry semantics — the McpApplier's env-presence gate is moot
    # here because `env` is empty, so the MCP starts as soon as the
    # integration is installed, and the proxy itself degrades to
    # discovery-only tools when zero accounts are connected.
    args: ["-y", "@alfe.ai/github-mcp@0.3.28"]
    requires_credentials: github

config_schema: []

capabilities:
  - github.repositories
  - github.issues
  - github.pull_requests
  - github.code_search
