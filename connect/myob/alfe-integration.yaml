id: myob
name: "MYOB Business"
version: 1.0.14
description: Connect your agent to MYOB Business — manage invoices, contacts, and finances via custom MCP server
license: MIT
min_gateway_version: 1.0.0

# Connect providers this integration's tools resolve credentials from.
# OR-semantics: any one satisfies. Validated against the connect provider registry.
requires_connection: [myob]

supported_agents: [openclaw, hermes, claude-code, codex, gemini-cli]

author:
  name: Alfe
  url: https://alfe.ai

pricing:
  type: free

features:
  - Full MYOB Business API access (contacts, invoices, payments, GL)
  - Automatic OAuth2 token refresh (20-min tokens)
  - Create and manage invoices, quotes, contacts
  - General ledger, chart of accounts, journal entries
  - Job tracking (list, get, create, update jobs for per-job reporting)
  - Profit and loss and balance sheet reports (account-level summaries)
  - Inventory items and adjustments

installs:
  runtimes:
    openclaw: {}
    # Hermes runs the same runtime-agnostic stdio MCP server declared in
    # the top-level `mcp_servers` block — no plugin/skill/config to apply.
    hermes: {}
    # Claude Code receives the same server through ClaudeCodeMcpSync
    # (~/.claude-code/mcp-config.json, ALFE_API_KEY injected).
    claude-code: {}
    # Codex receives the same server through CodexMcpSync
    # (~/.alfe/runtimes/codex/mcp-servers.json, ALFE_API_KEY injected).
    codex: {}
    # Gemini CLI receives the same server through TerminalMcpSync
    # (~/.alfe/runtimes/gemini-cli/mcp-servers.json, ALFE_API_KEY injected).
    gemini-cli: {}

mcp_servers:
  - id: myob
    command: npx
    args: ["-y", "@alfe.ai/myob-mcp@0.5.0"]
    # The proxy fetches credentials from the Alfe API at startup, so
    # no env interpolation is needed. The `requires_credentials` flag
    # makes the applier skip registration when MYOB isn't connected
    # yet — matches what the deleted post_activate.mjs hook did.
    requires_credentials: myob

config_schema: []
