id: google
name: "Google Workspace"
version: 1.0.16
description: Connect your agent to Google Workspace — Chat, Drive, Gmail, Calendar, Sheets, Docs and more
license: MIT
depends_on: []
min_gateway_version: 1.0.0

# Connect providers this integration's tools resolve credentials from.
# OR-semantics: any one satisfies. Validated against the connect provider registry.
requires_connection: [google]

# claude-code: Claude Code drives `gws` through its Bash tool, which only
# MANAGED claude-code agents have (self-hosted claude-code agents run a
# Bash-free tool allow-list). The manifest schema has no hosting field, so a
# self-hosted claude-code agent can install this but cannot use it; the
# alfe-google-workspace skill tells the agent to say so.
supported_agents: [openclaw, claude-code]

author:
  name: Alfe
  url: https://alfe.ai
icon: ./assets/icon.svg
preview_images:
  - ./assets/preview-dashboard.svg
pricing:
  type: free
features:
  - Google Chat messaging (DMs, spaces, threads)
  - Google Drive file management
  - Gmail send/read/triage
  - Google Calendar scheduling
  - Google Sheets read/write
  - Google Docs editing
  - Full Google Workspace CLI (80+ skills)

installs:
  runtimes:
    openclaw:
      plugins:
        - package: "@alfe.ai/openclaw-google@0.0.54"
      skills:
        # Core service skills
        - clawhub: gws-shared
        - clawhub: gws-chat
        - clawhub: gws-drive
        - clawhub: gws-gmail
        - clawhub: gws-calendar
        - clawhub: gws-sheets
        - clawhub: gws-docs
        - clawhub: gws-slides
        - clawhub: gws-tasks
        - clawhub: gws-people
        - clawhub: gws-forms
        - clawhub: gws-keep
        # Helper skills (common operations)
        - clawhub: gws-chat-send
        - clawhub: gws-gmail-send
        - clawhub: gws-gmail-triage
        - clawhub: gws-sheets-read
        - clawhub: gws-calendar-agenda
        - clawhub: gws-drive-upload
        - clawhub: gws-drive-search
    # No plugin on Claude Code (openclaw-google is an OpenClaw plugin). The
    # agent runs `gws` itself; `skills/gws-shared` is Alfe's replacement for
    # the upstream gws-shared skill (every gws-* skill reads
    # ../gws-shared/SKILL.md first). It carries the account selection and the
    # openclaw-google safety boundary (no `gws auth`, confirm destructive
    # methods, workspace-confined file paths) as instructions. The upstream
    # gws-shared and gws-calendar-agenda slugs are ambiguous on ClawHub (409)
    # and gws-drive-search does not exist (404), so they are not listed here.
    claude-code:
      skills:
        - path: skills/gws-shared
        - clawhub: gws-chat
        - clawhub: gws-drive
        - clawhub: gws-gmail
        - clawhub: gws-calendar
        - clawhub: gws-sheets
        - clawhub: gws-docs
        - clawhub: gws-slides
        - clawhub: gws-tasks
        - clawhub: gws-people
        - clawhub: gws-forms
        - clawhub: gws-keep
        - clawhub: gws-chat-send
        - clawhub: gws-gmail-send
        - clawhub: gws-gmail-triage
        - clawhub: gws-sheets-read
        - clawhub: gws-drive-upload

hooks:
  post_install: hooks/post-install.sh
  post_activate: hooks/post_activate.mjs
  post_uninstall: hooks/post_uninstall.mjs
  health_check: hooks/health.sh

config_schema: []

capabilities:
  - google.chat
  - google.drive
  - google.gmail
  - google.calendar
  - google.sheets
  - google.docs
  - google.workspace
