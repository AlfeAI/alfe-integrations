id: google
name: "Google Workspace"
version: 1.1.0
description: Connect your agent to Google Workspace — Chat, Drive, Gmail, Calendar, Sheets, Docs and more
license: MIT
depends_on: []
min_gateway_version: 1.0.0

# Connect providers this integration's tools resolve credentials from.
# OR-semantics: any one satisfies. Validated against the connect provider registry.
requires_connection: [google]

# Terminal runtimes (claude-code, codex, gemini-cli, grok-build) drive `gws`
# through their own shell tool, which every terminal host enables, managed
# and self-hosted. The gws-shared skill covers account selection and the
# commands that are off-limits.
supported_agents: [openclaw, claude-code, codex, gemini-cli, grok-build]

author:
  name: Alfe
  url: https://alfe.ai
icon: ./assets/icon.svg
preview_images:
  - ./assets/preview-dashboard.svg
pricing:
  type: free
features:
  - Google Chat messaging (DMs, spaces, threads)
  - Google Drive file management
  - Gmail send/read/triage
  - Google Calendar scheduling
  - Google Sheets read/write
  - Google Docs editing
  - Full Google Workspace CLI (80+ skills)

installs:
  runtimes:
    openclaw:
      plugins:
        - package: "@alfe.ai/openclaw-google@0.0.50"
      # The upstream gws-shared and gws-calendar-agenda slugs are ambiguous on
      # ClawHub (409) and gws-drive-search does not exist (404). The applier
      # never guesses a publisher, so listing them only stalls activation.
      skills:
        # Core service skills
        - clawhub: gws-chat
        - clawhub: gws-drive
        - clawhub: gws-gmail
        - clawhub: gws-calendar
        - clawhub: gws-sheets
        - clawhub: gws-docs
        - clawhub: gws-slides
        - clawhub: gws-tasks
        - clawhub: gws-people
        - clawhub: gws-forms
        - clawhub: gws-keep
        # Helper skills (common operations)
        - clawhub: gws-chat-send
        - clawhub: gws-gmail-send
        - clawhub: gws-gmail-triage
        - clawhub: gws-sheets-read
        - clawhub: gws-drive-upload
    # No plugin on Claude Code (openclaw-google is an OpenClaw plugin). The
    # agent runs `gws` itself; `skills/gws-shared` is Alfe's replacement for
    # the upstream gws-shared skill (every gws-* skill reads
    # ../gws-shared/SKILL.md first). It carries the account selection and the
    # openclaw-google safety boundary (no `gws auth`, confirm destructive
    # methods, workspace-confined file paths) as instructions. The upstream
    # gws-shared and gws-calendar-agenda slugs are ambiguous on ClawHub (409)
    # and gws-drive-search does not exist (404), so they are not listed here.
    claude-code:
      skills:
        - path: skills/gws-shared
        - clawhub: gws-chat
        - clawhub: gws-drive
        - clawhub: gws-gmail
        - clawhub: gws-calendar
        - clawhub: gws-sheets
        - clawhub: gws-docs
        - clawhub: gws-slides
        - clawhub: gws-tasks
        - clawhub: gws-people
        - clawhub: gws-forms
        - clawhub: gws-keep
        - clawhub: gws-chat-send
        - clawhub: gws-gmail-send
        - clawhub: gws-gmail-triage
        - clawhub: gws-sheets-read
        - clawhub: gws-drive-upload
    codex:
      skills:
        - path: skills/gws-shared
        - clawhub: gws-chat
        - clawhub: gws-drive
        - clawhub: gws-gmail
        - clawhub: gws-calendar
        - clawhub: gws-sheets
        - clawhub: gws-docs
        - clawhub: gws-slides
        - clawhub: gws-tasks
        - clawhub: gws-people
        - clawhub: gws-forms
        - clawhub: gws-keep
        - clawhub: gws-chat-send
        - clawhub: gws-gmail-send
        - clawhub: gws-gmail-triage
        - clawhub: gws-sheets-read
        - clawhub: gws-drive-upload
    gemini-cli:
      skills:
        - path: skills/gws-shared
        - clawhub: gws-chat
        - clawhub: gws-drive
        - clawhub: gws-gmail
        - clawhub: gws-calendar
        - clawhub: gws-sheets
        - clawhub: gws-docs
        - clawhub: gws-slides
        - clawhub: gws-tasks
        - clawhub: gws-people
        - clawhub: gws-forms
        - clawhub: gws-keep
        - clawhub: gws-chat-send
        - clawhub: gws-gmail-send
        - clawhub: gws-gmail-triage
        - clawhub: gws-sheets-read
        - clawhub: gws-drive-upload
    grok-build:
      skills:
        - path: skills/gws-shared
        - clawhub: gws-chat
        - clawhub: gws-drive
        - clawhub: gws-gmail
        - clawhub: gws-calendar
        - clawhub: gws-sheets
        - clawhub: gws-docs
        - clawhub: gws-slides
        - clawhub: gws-tasks
        - clawhub: gws-people
        - clawhub: gws-forms
        - clawhub: gws-keep
        - clawhub: gws-chat-send
        - clawhub: gws-gmail-send
        - clawhub: gws-gmail-triage
        - clawhub: gws-sheets-read
        - clawhub: gws-drive-upload

hooks:
  post_install: hooks/post-install.sh
  post_activate: hooks/post_activate.mjs
  post_uninstall: hooks/post_uninstall.mjs
  health_check: hooks/health.sh

config_schema: []

capabilities:
  - google.chat
  - google.drive
  - google.gmail
  - google.calendar
  - google.sheets
  - google.docs
  - google.workspace
