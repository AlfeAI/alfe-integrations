id: alfe
name: "Alfe"
version: 1.1.72
description: Core Alfe platform plugin — integration management, LLM proxy routing, chat + webhooks + console
license: MIT
depends_on: []
supported_agents: [openclaw]

# Alfe brand app-icon tile (light symbol on purple gradient) — the website
# logo, self-contained so it reads on both light and dark dashboards. Rendered
# from brand/masters/icon-tile.svg. Relative path is resolved to a commit-pinned
# raw.githubusercontent.com URL at publish time (see integrations DEVELOPING.md).
icon: ./assets/icon.png

# Folded in from the legacy `console` integration (PR 12 of
# channels-and-credential-driven-integrations). The console
# integration carried a single `post_activate` hook that ensured
# `~/.openclaw/openclaw.json` had `gateway.auth.token` set so the
# daemon could authenticate its own loopback requests when
# forwarding console traffic to localhost:18789. The hook is now
# baselined with `alfe`.
hooks:
  post_activate: hooks/post_activate.js

author:
  name: Alfe
  url: https://alfe.ai

pricing:
  type: free

installs:
  runtimes:
    openclaw:
      plugins:
        - package: "@alfe.ai/openclaw@0.6.0"
        # openclaw-metrics was a no-op after activity tracking moved to chat
        # service events. Its final publish is legacy-activate-only, so retire
        # it before the OpenClaw 2 rollout rather than keep dead runtime code.
        - package: "@alfe.ai/openclaw-identity@0.2.0"
        - package: "@alfe.ai/openclaw-search@0.0.47"
        - package: "@alfe.ai/openclaw-secrets@0.2.34"
        - package: "@alfe.ai/openclaw-mcp-bundler@0.0.33"
        # Folded in from the legacy `chat` integration (PR 11 of
        # channels-and-credential-driven-integrations). The chat plugin
        # is now a platform-baseline capability and ships with `alfe`.
        - package: "@alfe.ai/openclaw-chat@0.9.28"
        # Folded in from the legacy `webhooks` integration (PR 11).
        - package: "@alfe.ai/openclaw-webhooks@0.0.26"
        # Folded in from the legacy `console` integration (PR 12 follow-up to
        # channels-and-credential-driven-integrations). The console plugin
        # is now a platform-baseline capability and ships with alfe.
        - package: "@alfe.ai/openclaw-console@0.0.14"
        # Scoped org/team/project knowledge resources: search + read + propose/
        # edit shared DOCUMENTS + profile (facts primitive removed 2026-07-06 —
        # one home per fact; agents find the right doc and edit it, quick capture
        # stays in private per-agent memory). Ships resource_propose_change so a
        # non-member agent can propose to scopes it can't write directly.
        # 0.0.8 = the propose-change build (0.0.7 predates it). NOTE: pinned
        # ahead of publish at the user's request — must be live on npm before any
        # agent reconcile picks this up.
        - package: "@alfe.ai/openclaw-knowledge@0.0.29"
        # Voice tools are a platform-baseline capability: EVERY agent gets
        # `voice_tts` / `voice_stt` (and the telephony placeholder tools),
        # not just agents with a phone number. The `voice` channel
        # integration therefore no longer re-declares this plugin — it owns
        # only the Twilio/telephony concern. Single owner avoids the
        # bare-name install dedup silently ignoring a divergent second pin.
        - package: "@alfe.ai/openclaw-voice@0.2.8"
        # Interactive remote-control relay. A CORE capability (like chat /
        # console / webhooks / voice above) so EVERY agent gets the relay
        # connection + web terminal — the terminal needs no browser at all.
        # The browser co-browse surface additionally needs Chrome (the
        # `headless-browser` integration) and degrades gracefully when it's
        # absent: the terminal + relay keep working, only browser_* tools error.
        # Reads `browser.ssrfPolicy` from the config block below; derives its
        # per-stage relay URL from the agent's apiUrl (no hardcoded URL).
        #
        # 0.1.0 additionally exposes the shared, turn-gated browser operation
        # helper used by optional local browser-session integrations.
        # Author the pin with the matching Alfe changeset. Registry sync must
        # wait until @alfe.ai/openclaw-remote@0.1.2 and its browser dependency
        # have been published, or installation fails "version not found".
        # 0.1.2 pulls @alfe.ai/browser 0.3.1: takeover input is dispatched in
        # order, so the first key after a click is no longer dropped.
        # 0.1.10 advertises SURFACES (browser:false when Chrome is missing) so
        # the relay's presence check can refuse takeovers with no browser, and
        # maps the takeover API's 409/503 to clear tool errors (alfe PR #580).
        # 0.1.12 runs on @alfe.ai/remote-host (shared with terminal-runtime
        # hosts), sends its start time so the relay keeps the newest owner during
        # runtime switches, and honours the per-agent web terminal setting
        # (alfe PRs #581 + #582). Lands with #582's gitlink bump.
        - package: "@alfe.ai/openclaw-remote@0.1.12"
      skills:
        # Folded in from the legacy `webhooks` integration's
        # `installs.runtimes.openclaw.skills` (PR 11). Lives at
        # integrations/integrations/alfe/skills/webhook-handler/ in the
        # submodule.
        - path: skills/webhook-handler
      config:
        # OpenClaw only lets BUNDLED plugins register conversation hooks
        # (`agent_end` on every pinned runtime; `before_prompt_build` too from
        # 2026.8.1). Our npm-installed plugins are "non-bundled", so without
        # this grant the runtime silently drops their hooks: identity context
        # and knowledge injection never reach the prompt (2026-10-04: "typed
        # hook ... blocked because non-bundled plugins must set
        # plugins.entries.<id>.hooks.allowConversationAccess=true").
        # Applied as a `--merge` patch on `plugins.entries`, so the entry's
        # other fields survive on apply. This manifest is the sole owner of
        # these two entries: removing it drops the whole entry.
        plugins:
          entries:
            "@alfe.ai/openclaw-identity":
              hooks:
                allowConversationAccess: true
            "@alfe.ai/openclaw-knowledge":
              hooks:
                allowConversationAccess: true
        browser:
          ssrfPolicy:
            dangerouslyAllowPrivateNetwork: true
        session:
          dmScope: "per-channel-peer"
        # OpenClaw (default on) injects an "[OpenClaw exec completion]" turn
        # into the ORIGINATING chat whenever a backgrounded exec exits, and
        # tells the model to relay the output. On 2026.9.5 customers saw the
        # agent's "this is internal system context" answers to those turns
        # land in their chat as replies to their own questions. Off: the
        # model polls background jobs with the `process` tool instead.
        # Known key with the same schema on every pinned runtime
        # (2026.6.11, 2026.8.1, 2026.9.5), so the batch apply cannot reject it.
        #
        # `toolSearch: false` turns off OpenClaw's structured Tool Search
        # (2026-10-20). From 2026.9.7 an UNSET key means ON: tools hide behind
        # tool_search/tool_describe/tool_call, so an MCP call becomes
        # tool_call{id:"alfe_mcp_call",args:{tool,args}}, triple-nested JSON
        # that DeepSeek V4 Pro fumbles into a malformed tool call ("Agent
        # couldn't generate a response"). The mcp-bundler already compacts our
        # MCP catalogue behind alfe_mcp_call, so OpenClaw's own search is
        # redundant. The key is `boolean | {...}` on every runtime we run
        # (2026.6.11, 2026.8.1, 2026.9.5, 2026.9.7, 2026.9.8 verified in dist);
        # use the boolean form only (9.7 dropped mode "code" from the object).
        # Before 2026.9.7 unset already resolved to off (bar the automatic
        # Tool Search that Ollama / local-model lean defaults turn on, which an
        # explicit `false` also suppresses), so older agents see no change.
        # `tools.codeMode` (9.7 default "auto") is deliberately left alone: it
        # only engages via catalog compat on native provider baseUrls, and Alfe
        # routes every provider through the local proxy.
        tools:
          toolSearch: false
          exec:
            notifyOnExit: false
        # Structured thinking for reasoning-capable models (claude-*).
        # OpenClaw has NO per-dispatch thinking parameter — the chat
        # relay's `thinking:'low'` RPC field can't reach the run; the
        # level resolves session `/think` override → per-agent
        # `thinkingDefault` → this default. TWO keys gate live thought
        # streaming (verified against the openclaw dist):
        #   - thinkingDefault != off  → the model PRODUCES reasoning
        #   - reasoningDefault: stream → reasoning is EMITTED to the
        #     agent-event bus as stream:'thinking' deltas (what the
        #     console shows and the chat plugin forwards as thinking
        #     cards). "off" (the default) emits nothing; "on" would fold
        #     reasoning into the reply text instead — never use it here.
        # `low` bounds the token cost; `/think off|high` and `/reasoning`
        # per-session overrides still win.
        #
        # Agents run as long as they need (decision 2026-10-14): a turn ends
        # on completion, user Stop, out-of-credits, or liveness loss — never
        # on elapsed time. OpenClaw's own per-run cap defaults to 48 h; lift
        # it to "effectively unlimited". NOT `0`: `0` means no-limit on
        # 2026.8.x+ but is schema-INVALID on 2026.6.11 (`.positive()`), and an
        # invalid value makes the whole config unloadable. 2147000 s equals
        # OpenClaw's own NO_TIMEOUT_MS (2147e6 ms), stays under Node's 2^31-1
        # ms timer ceiling, and is a positive int on every pinned runtime
        # (2026.6.11, 2026.8.1, 2026.9.5, 2026.9.7, 2026.10.3 verified in dist).
        #
        # The per-command exec cap (`tools.exec`, default 1800 s) is NOT set
        # here: the key is `timeoutSec` on 2026.6.11 but `timeoutSeconds` on
        # 2026.8.x+, both under `.strict()` schemas, so no single key is valid
        # fleet-wide — and `0` is rejected (`.positive()`) on all of them.
        agents:
          defaults:
            thinkingDefault: "low"
            reasoningDefault: "stream"
            timeoutSeconds: 2147000
        # Folded in from the legacy `console` integration (PR 12). The
        # console plugin maintains an outbound WS to the console service
        # and multiplexes browser sessions over it — no gateway data-
        # plane hop, no public IP. `allowedOrigins` lists the console
        # service origins permitted to attach; `dangerouslyDisableDevice
        # Auth` short-circuits the local device-auth handshake because
        # the daemon's tunnel handler now injects an authenticated token
        # via the post_activate hook below.
        gateway:
          controlUi:
            allowedOrigins:
              - "https://console.dev.alfe.ai"
              - "https://console.alfe.ai"
            dangerouslyDisableDeviceAuth: true
        models:
          providers:
            anthropic:
              baseUrl: "http://127.0.0.1:18193"
              apiKey: "alfe-proxy"
              api: "anthropic-messages"
              # The anthropic-messages transport hard-requires a positive
              # maxTokens on every model definition (bare {id, name} entries
              # are schema-enriched with maxTokens: 0 and every run fails
              # with "requires a positive maxTokens value"). The OpenAI-style
              # providers below don't need it — max_tokens is optional there.
              models:
                - id: claude-opus-5-5
                  name: "Claude Opus 5.5"
                  contextWindow: 1000000
                  maxTokens: 128000
                - id: claude-opus-5
                  name: "Claude Opus 5"
                  contextWindow: 1000000
                  maxTokens: 128000
                - id: claude-opus-4-8
                  name: "Claude Opus 4.8"
                  contextWindow: 1000000
                  maxTokens: 128000
                - id: claude-opus-4-7
                  name: "Claude Opus 4.7"
                  contextWindow: 1000000
                  maxTokens: 128000
                - id: claude-opus-4-6
                  name: "Claude Opus 4.6"
                  contextWindow: 1000000
                  maxTokens: 128000
                - id: claude-sonnet-5-5
                  name: "Claude Sonnet 5.5"
                  contextWindow: 1000000
                  maxTokens: 128000
                - id: claude-sonnet-5
                  name: "Claude Sonnet 5"
                  contextWindow: 1000000
                  maxTokens: 128000
                - id: claude-sonnet-4-6
                  name: "Claude Sonnet 4.6"
                  contextWindow: 1000000
                  maxTokens: 128000
                # OpenClaw 2026.9.5's Claude request contracts don't recognise
                # haiku-5-x: @openclaw/ai would send no thinking config at all
                # (the agent's thinking level is ignored and Haiku runs at its
                # default effort, with no reasoning stream), and would pass a
                # caller temperature through, which Haiku 5.5 rejects with a
                # 400. `canonicalModelId` is the seam OpenClaw itself uses for
                # unreleased Claude generations (non-Sonnet → claude-opus-5):
                # adaptive thinking + effort from the thinking level, sampling
                # params stripped. Drop it once the pinned runtime knows
                # claude-haiku-5-5.
                - id: claude-haiku-5-5
                  name: "Claude Haiku 5.5"
                  contextWindow: 1000000
                  maxTokens: 128000
                  params:
                    canonicalModelId: "claude-opus-5"
                - id: claude-haiku-4-5
                  name: "Claude Haiku 4.5"
                  contextWindow: 200000
                  maxTokens: 64000
            openai:
              baseUrl: "http://127.0.0.1:18193/v1"
              apiKey: "alfe-proxy"
              api: "openai-completions"
              models:
                - id: gpt-6-astra
                  name: "GPT-6 Astra"
                - id: gpt-6.1-sol
                  name: "GPT-6.1 Sol"
                - id: gpt-6-sol
                  name: "GPT-6 Sol"
                - id: gpt-6-luna
                  name: "GPT-6 Luna"
                - id: gpt-4o
                  name: "GPT-4o"
                - id: gpt-4o-mini
                  name: "GPT-4o Mini"
                - id: o3
                  name: "o3"
                - id: gpt-4.1
                  name: "GPT-4.1"
                - id: gpt-4.1-mini
                  name: "GPT-4.1 Mini"
                - id: gpt-5.4
                  name: "GPT-5.4"
                - id: gpt-5.4-mini
                  name: "GPT-5.4 Mini"
                - id: gpt-5.4-nano
                  name: "GPT-5.4 Nano"
                - id: gpt-5.4-pro
                  name: "GPT-5.4 Pro"
                - id: gpt-5.5
                  name: "GPT-5.5"
                - id: gpt-5.5-pro
                  name: "GPT-5.5 Pro"
                - id: gpt-5.6-sol
                  name: "GPT-5.6 Sol"
                - id: gpt-5.6-terra
                  name: "GPT-5.6 Terra"
                - id: gpt-5.6-luna
                  name: "GPT-5.6 Luna"
                # o3-mini / o4-mini / gpt-4.1-nano removed 2026-10-20 — shut down
                # upstream 2026-10-23.
                # AWS-managed Sydney models still use the Alfe loopback proxy.
                # The server registry/boundary policy owns routing and access;
                # these are transport capabilities, never an authorization list.
                # AWS model cards: GPT-OSS 128K, Qwen Coder 256K context, 16K output.
                # https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-oss-120b.html
                # https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-oss-20b.html
                # https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-qwen-qwen3-coder-30b-a3b-instruct.html
                # Keep exact IDs/maxTokens: unknown proxy models otherwise inherit
                # a 200K output budget that the private adapter correctly rejects.
                # Strict schemas / prompt caching are unavailable on this route.
                - id: "openai.gpt-oss-120b-1:0"
                  name: "GPT-OSS 120B (AWS Sydney)"
                  reasoning: true
                  input: [text]
                  contextWindow: 131072
                  maxTokens: 16384
                  compat:
                    supportsStore: false
                    supportsDeveloperRole: false
                    supportsStrictMode: false
                    supportsPromptCacheKey: false
                    supportsReasoningEffort: true
                    maxTokensField: "max_tokens"
                - id: "openai.gpt-oss-20b-1:0"
                  name: "GPT-OSS 20B (AWS Sydney)"
                  reasoning: true
                  input: [text]
                  contextWindow: 131072
                  maxTokens: 16384
                  compat:
                    supportsStore: false
                    supportsDeveloperRole: false
                    supportsStrictMode: false
                    supportsPromptCacheKey: false
                    supportsReasoningEffort: true
                    maxTokensField: "max_tokens"
                - id: "qwen.qwen3-coder-30b-a3b-v1:0"
                  name: "Qwen3 Coder 30B (AWS Sydney)"
                  reasoning: false
                  input: [text]
                  contextWindow: 262144
                  maxTokens: 16384
                  compat:
                    supportsStore: false
                    supportsDeveloperRole: false
                    supportsStrictMode: false
                    supportsPromptCacheKey: false
                    supportsReasoningEffort: false
                    maxTokensField: "max_tokens"
                # These exact AWS IDs must remain under the loopback provider;
                # publisher aliases select different, non-private model routes.
                # https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-zai-glm-5.html
                # https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-moonshot-ai-kimi-k2-5.html
                # https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-deepseek-deepseek-v3-2.html
                # Conservatively interpret the cards' rounded K limits. GLM's
                # output is additionally capped below AWS's 128K by our adapter.
                # Kimi vision and structured outputs are not exposed here.
                # Preserve assistant reasoning during tool replay: OpenClaw's
                # publisher-name heuristics do not recognize these AWS IDs.
                - id: "zai.glm-5"
                  name: "GLM 5 (AWS Sydney)"
                  reasoning: true
                  input: [text]
                  contextWindow: 200000
                  maxTokens: 16000
                  compat:
                    supportsStore: false
                    supportsDeveloperRole: false
                    supportsStrictMode: false
                    supportsPromptCacheKey: false
                    # Native reasoning only; Converse's effort field is unverified.
                    supportsReasoningEffort: false
                    requiresReasoningContentOnAssistantMessages: true
                    maxTokensField: "max_tokens"
                - id: "moonshotai.kimi-k2.5"
                  name: "Kimi K2.5 (AWS Sydney)"
                  reasoning: true
                  input: [text]
                  contextWindow: 256000
                  maxTokens: 16000
                  compat:
                    supportsStore: false
                    supportsDeveloperRole: false
                    supportsStrictMode: false
                    supportsPromptCacheKey: false
                    supportsReasoningEffort: true
                    requiresReasoningContentOnAssistantMessages: true
                    maxTokensField: "max_tokens"
                - id: "deepseek.v3.2"
                  name: "DeepSeek V3.2 (AWS Sydney)"
                  reasoning: true
                  input: [text]
                  contextWindow: 164000
                  maxTokens: 8000
                  compat:
                    supportsStore: false
                    supportsDeveloperRole: false
                    supportsStrictMode: false
                    supportsPromptCacheKey: false
                    supportsReasoningEffort: true
                    requiresReasoningContentOnAssistantMessages: true
                    maxTokensField: "max_tokens"
                # Standard Fly-connected aliases use the AWS Lambda/Bedrock route.
                # They do not confer AWS-only chat, memory, files or agent hosting.
                # Native IDs above remain distinct for existing strict policies.
                - id: "alfe-bedrock-openai.gpt-oss-120b-1:0"
                  name: "GPT-OSS 120B (AWS-hosted Sydney; Fly-connected)"
                  reasoning: true
                  input: [text]
                  contextWindow: 131072
                  maxTokens: 16384
                  compat:
                    supportsStore: false
                    supportsDeveloperRole: false
                    supportsStrictMode: false
                    supportsPromptCacheKey: false
                    supportsReasoningEffort: true
                    maxTokensField: "max_tokens"
                - id: "alfe-bedrock-openai.gpt-oss-20b-1:0"
                  name: "GPT-OSS 20B (AWS-hosted Sydney; Fly-connected)"
                  reasoning: true
                  input: [text]
                  contextWindow: 131072
                  maxTokens: 16384
                  compat:
                    supportsStore: false
                    supportsDeveloperRole: false
                    supportsStrictMode: false
                    supportsPromptCacheKey: false
                    supportsReasoningEffort: true
                    maxTokensField: "max_tokens"
                - id: "alfe-bedrock-qwen.qwen3-coder-30b-a3b-v1:0"
                  name: "Qwen3 Coder 30B (AWS-hosted Sydney; Fly-connected)"
                  reasoning: false
                  input: [text]
                  contextWindow: 262144
                  maxTokens: 16384
                  compat:
                    supportsStore: false
                    supportsDeveloperRole: false
                    supportsStrictMode: false
                    supportsPromptCacheKey: false
                    supportsReasoningEffort: false
                    maxTokensField: "max_tokens"
                - id: "alfe-bedrock-zai.glm-5"
                  name: "GLM 5 (AWS-hosted Sydney; Fly-connected)"
                  reasoning: true
                  input: [text]
                  contextWindow: 200000
                  maxTokens: 16000
                  compat:
                    supportsStore: false
                    supportsDeveloperRole: false
                    supportsStrictMode: false
                    supportsPromptCacheKey: false
                    supportsReasoningEffort: false
                    requiresReasoningContentOnAssistantMessages: true
                    maxTokensField: "max_tokens"
                - id: "alfe-bedrock-moonshotai.kimi-k2.5"
                  name: "Kimi K2.5 (AWS-hosted Sydney; Fly-connected)"
                  reasoning: true
                  input: [text]
                  contextWindow: 256000
                  maxTokens: 16000
                  compat:
                    supportsStore: false
                    supportsDeveloperRole: false
                    supportsStrictMode: false
                    supportsPromptCacheKey: false
                    supportsReasoningEffort: true
                    requiresReasoningContentOnAssistantMessages: true
                    maxTokensField: "max_tokens"
                - id: "alfe-bedrock-deepseek.v3.2"
                  name: "DeepSeek V3.2 (AWS-hosted Sydney; Fly-connected)"
                  reasoning: true
                  input: [text]
                  contextWindow: 164000
                  maxTokens: 8000
                  compat:
                    supportsStore: false
                    supportsDeveloperRole: false
                    supportsStrictMode: false
                    supportsPromptCacheKey: false
                    supportsReasoningEffort: true
                    requiresReasoningContentOnAssistantMessages: true
                    maxTokensField: "max_tokens"
            google:
              baseUrl: "http://127.0.0.1:18193/v1"
              apiKey: "alfe-proxy"
              api: "openai-completions"
              models:
                - id: gemini-4-argon
                  name: "Gemini 4 Argon"
                - id: gemini-3.8-flash
                  name: "Gemini 3.8 Flash"
                - id: gemini-3.6-flash
                  name: "Gemini 3.6 Flash"
                - id: gemini-3.5-flash-lite
                  name: "Gemini 3.5 Flash Lite"
                - id: gemini-3.1-pro-preview
                  name: "Gemini 3.1 Pro"
                - id: gemini-3.1-flash-lite
                  name: "Gemini 3.1 Flash Lite"
                - id: gemini-2.5-pro
                  name: "Gemini 2.5 Pro"
                - id: gemini-2.5-flash
                  name: "Gemini 2.5 Flash"
                - id: gemini-2.5-flash-lite
                  name: "Gemini 2.5 Flash Lite"
            deepseek:
              baseUrl: "http://127.0.0.1:18193/v1"
              apiKey: "alfe-proxy"
              api: "openai-completions"
              models:
                # `maxTokens` is load-bearing: OpenClaw only sends `max_tokens`
                # when the model declares it (`if (clampedMaxTokens)`), so a bare
                # entry lets DeepSeek apply its own small server-side default and
                # tool-heavy turns terminate with `stopReason=length` — surfaced
                # to the user as "Agent couldn't generate a response".
                # DeepSeek v4 / v4.1 document 1M context / 384K max output.
                # `deepseek-flash` is the un-versioned V4.1 Flash id (2026-09-10);
                # `deepseek-v4-flash` is a temporary alias that routes to it.
                # deepseek-chat / deepseek-reasoner were hard-retired upstream
                # 2026-07-24 and removed here.
                - id: deepseek-flash
                  name: "DeepSeek V4.1 Flash"
                  contextWindow: 1000000
                  maxTokens: 64000
                - id: deepseek-v4-pro
                  name: "DeepSeek V4 Pro"
                  contextWindow: 1000000
                  maxTokens: 64000
                - id: deepseek-v4-flash
                  name: "DeepSeek V4 Flash"
                  contextWindow: 1000000
                  maxTokens: 64000
            minimax:
              baseUrl: "http://127.0.0.1:18193/v1"
              apiKey: "alfe-proxy"
              api: "openai-completions"
              models:
                - id: MiniMax-M3.1-Flash
                  name: "MiniMax M3.1 Flash"
                - id: MiniMax-M3
                  name: "MiniMax M3"
                - id: MiniMax-M2.7
                  name: "MiniMax M2.7"
                - id: MiniMax-M2.7-highspeed
                  name: "MiniMax M2.7 High Speed"
                - id: MiniMax-M2.5
                  name: "MiniMax M2.5"
            mistral:
              baseUrl: "http://127.0.0.1:18193/v1"
              apiKey: "alfe-proxy"
              api: "openai-completions"
              models:
                - id: mistral-large-4
                  name: "Mistral Large 4"
                - id: mistral-large-latest
                  name: "Mistral Large"
                - id: mistral-medium-latest
                  name: "Mistral Medium"
                - id: mistral-small-latest
                  name: "Mistral Small"
                - id: codestral-latest
                  name: "Codestral"
                - id: ministral-14b-latest
