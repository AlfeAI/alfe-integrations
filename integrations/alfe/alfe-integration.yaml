                  name: "GLM 4.5 Air"
            moonshot:
              baseUrl: "http://127.0.0.1:18193/v1"
              apiKey: "alfe-proxy"
              api: "openai-completions"
              models:
                - id: kimi-k3
                  name: "Kimi K3"
                - id: kimi-k2.6
                  name: "Kimi K2.6"
                - id: kimi-k2.7-code
                  name: "Kimi K2.7 Code"
                - id: kimi-k2.7-code-highspeed
                  name: "Kimi K2.7 Code HighSpeed"
            qwen:
              baseUrl: "http://127.0.0.1:18193/v1"
              apiKey: "alfe-proxy"
              api: "openai-completions"
              models:
                - id: qwen3.7-max
                  name: "Qwen 3.7 Max"
                - id: qwen3.7-plus
                  name: "Qwen 3.7 Plus"
                - id: qwen3.6-flash
                  name: "Qwen 3.6 Flash"
                - id: qwen3.5-flash
